<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" role="img" aria-labelledby="title">
  <title id="title">匯入文件、核對案件及下載成果</title>
  <style>
    .tile{fill:#edf4ff;stroke:#a5bce3}
    .symbol,.arrow{fill:none;stroke:#08358c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    text{fill:#193247;font:700 19px system-ui,"Microsoft JhengHei",sans-serif;text-anchor:middle}
